name: Ruijie Netlify Bot Tests

on:
  push:
    paths:
      - "ruijie-netlify-bot/**"
      - ".github/workflows/ruijie-netlify-bot-tests.yml"
  pull_request:
    paths:
      - "ruijie-netlify-bot/**"
      - ".github/workflows/ruijie-netlify-bot-tests.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruijie-netlify-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ruijie-netlify-bot/package.json
      - run: npm install
      - run: npm run typecheck
