<!doctype html>
<html lang="en">
<head>

<title>NETFORGE IT STORE</title>
<style>
:root{--bg:#050607;--panel:#0b0e11;--blue:#38aef0;--muted:#8a9098;--text:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;overflow-x:hidden}
header{height:88px;border-bottom:1px solid #171a1e;background:#050607;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:15px}.logo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2px solid #1f526d;box-shadow:0 0 25px #0f4f7044;background:radial-gradient(circle,#30363c 0 34%,#111820 35% 60%,#06131b 61%);font-size:31px}.brand b{display:block;letter-spacing:3px;font-size:24px}.brand small{display:block;color:#3db8ff;letter-spacing:3px;margin-top:3px;font-size:10px}nav{display:flex;gap:42px;color:#777;font-weight:700;font-size:11px;letter-spacing:2px}.cart{font-size:25px;color:#777}
.hero{min-height:calc(100vh - 88px);position:relative;display:flex;align-items:center;overflow:hidden;background:radial-gradient(circle at 77% 45%,#18304155,transparent 26%),linear-gradient(90deg,#020304 0%,#07090c 48%,#090d12 100%)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 47% 50%,#14212d22 0 20%,transparent 55%),repeating-linear-gradient(135deg,transparent 0 18px,#ffffff05 19px 20px);opacity:.8}.dragon{position:absolute;inset:0;background:radial-gradient(circle at 48% 47%,#17222b66,transparent 28%),radial-gradient(circle at 60% 48%,#10202d55,transparent 34%);filter:contrast(120%)}
.content{position:relative;z-index:2;width:48%;padding-left:11vw}.eyebrow{display:flex;align-items:center;gap:12px;color:#3bb9ff;letter-spacing:3px;font-size:10px;font-weight:700;margin-bottom:28px}.eyebrow:before{content:"";width:28px;height:1px;background:#3bb9ff}.eyebrow span{color:#666}.title{font-size:58px;line-height:.98;letter-spacing:-1px;font-weight:900;margin:0 0 20px;text-transform:uppercase}.desc{color:#a5a9af;max-width:410px;line-height:1.6;font-size:15px}.badges{display:flex;gap:10px;margin:22px 0}.badge{border:1px solid #30343a;padding:8px 12px;font-size:10px;color:#aeb4bb;background:#0a0c0f}.price{display:flex;align-items:center;gap:18px;margin:25px 0 26px}.price strong{font-size:32px}.rating{color:#42b8ff;font-weight:700;font-size:13px}.reviews{color:#666;font-size:12px}.buttons{display:flex;gap:12px}.btn{padding:15px 28px;border:1px solid #35393d;text-decoration:none;color:#fff;font-size:11px;font-weight:800;letter-spacing:1.5px}.btn.primary{background:#45a9e5;border-color:#45a9e5;color:#071018;clip-path:polygon(0 0,100% 0,100% 80%,94% 100%,0 100%)}
.product{position:absolute;z-index:2;right:10vw;top:50%;transform:translateY(-48%);width:min(36vw,520px);aspect-ratio:1/1}.router{position:absolute;left:22%;top:22%;width:58%;height:55%;background:linear-gradient(145deg,#25282c,#0d0f12 60%,#171a1e);clip-path:polygon(26% 0,74% 0,100% 28%,86% 100%,14% 100%,0 28%);box-shadow:0 30px 80px #000}.router:before{content:"";position:absolute;inset:18% 25%;background:conic-gradient(from 45deg,#47e65c 0 4%,transparent 4% 21%,#47e65c 21% 25%,transparent 25% 46%,#47e65c 46% 50%,transparent 50% 71%,#47e65c 71% 75%,transparent 75%);filter:drop-shadow(0 0 5px #42df57)}.router:after{content:"mi";position:absolute;top:46%;left:48%;color:#c49755;font-weight:700;font-size:12px}.ant{position:absolute;width:10%;height:55%;background:linear-gradient(#33373b,#111316);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);top:2%}.a1{left:12%;transform:rotate(-13deg)}.a2{left:28%;transform:rotate(-5deg)}.a3{right:28%;transform:rotate(5deg)}.a4{right:12%;transform:rotate(13deg)}.a5{left:8%;top:42%;height:42%;transform:rotate(-9deg)}.a6{right:8%;top:42%;height:42%;transform:rotate(9deg)}
.note{position:absolute;bottom:20px;right:28px;color:#555;font-size:10px;letter-spacing:1px}
@media(max-width:900px){nav{display:none}.content{width:100%;padding:70px 7vw 360px}.title{font-size:44px}.product{width:500px;right:50%;transform:translate(50%,-10%);top:auto;bottom:-40px}.hero{align-items:flex-start}.cart{display:none}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🐉</div><div><b>NETFORGE</b><small>IT STORE</small></div></div><nav><span>PRODUCTS</span><span>CONFIGURE</span><span>COMPARE</span><span>SUPPORT</span></nav><div class="cart">🛒</div></header>
<main class="hero"><div class="dragon"></div><section class="content"><div class="eyebrow">FLAGSHIP <span>· TRI-BAND</span></div><h1 class="title">XIAOMI AX9000<br>TRI-BAND</h1><p class="desc">12 high-gain antennas. 9000 Mbps. Built for the most demanding networks on the planet.</p><div class="badges"><span class="badge">◉ WI-FI 7</span><span class="badge">⚡ &lt;1MS LATENCY</span><span class="badge">▣ TRI-BAND</span></div><div class="price"><strong>$449.99</strong><span class="rating">4.9 ★★★★★</span><span class="reviews">847 reviews</span></div><div class="buttons"><a class="btn primary" href="#">CONFIGURE YOURS →</a><a class="btn" href="#">VIEW LINEUP</a></div></section><section class="product"><i class="ant a1"></i><i class="ant a2"></i><i class="ant a3"></i><i class="ant a4"></i><i class="ant a5"></i><i class="ant a6"></i><div class="router"></div></section><div class="note">NETFORGE IT STORE</div></main>
</body>
</html>
